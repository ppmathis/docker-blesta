# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: blesta-test

services:
  proxy:
    image: traefik:3
    command:
      - --accessLog=true
      - --entryPoints.http.address=:8080/tcp
      - --entryPoints.https.address=:8443/tcp
      - --providers.file.filename=/etc/traefik/dynamic.yaml
    ports:
      - 127.0.0.1:4200:8080/tcp
      - 127.0.0.1:4201:8443/tcp
    configs:
      - source: traefik-config
        target: /etc/traefik/dynamic.yaml

  blesta:
    image: ${BLESTA_IMAGE:-localhost/blesta:latest}
    platform: ${BLESTA_PLATFORM:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BLESTA_ADDRESS: 127.0.0.1
      BLESTA_CRON_SCHEDULE: ${BLESTA_TEST_CRON_SCHEDULE:-#}
      BLESTA_CRON_HEALTHCHECK_URL: http://cron-monitor:8080/ping
      BLESTA_HOST: localhost
    volumes:
      - blesta-data:/opt/blesta/data
    tmpfs:
      - /run:uid=65532,gid=65532,mode=0755,exec,nodev,nosuid
      - /tmp:uid=65532,gid=65532,mode=2777,noexec,nodev,nosuid
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mariadb:
    image: docker.io/library/mariadb:11.4
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    environment:
      MARIADB_DATABASE: blesta
      MARIADB_USER: blesta
      MARIADB_PASSWORD: blesta
      MARIADB_ROOT_PASSWORD: root
    ports:
      - 127.0.0.1:4202:3306/tcp
    volumes:
      - mariadb-data:/var/lib/mysql
    configs:
      - source: mariadb-config
        target: /etc/mysql/conf.d/blesta.cnf

  cron-monitor:
    image: docker.io/library/node:24-alpine
    command:
      - node
      - -e
      - |
        const http = require('node:http');
        let count = 0;
        http.createServer((req, res) => {
          if (req.url === '/ping') count++;
          res.end(String(count));
        }).listen(8080, '0.0.0.0');
    ports:
      - 127.0.0.1:4204:8080

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_POP3_AUTH: blesta:blesta
    networks:
      default:
        aliases:
          - mailpit
          - mailpit.local
    ports:
      - 127.0.0.1:4203:8025/tcp

configs:
  traefik-config:
    content: |
      http:
        routers:
          blesta-http:
            rule: HostRegexp(`.+`)
            service: blesta
            entryPoints: [http]
          blesta-https:
            rule: HostRegexp(`.+`)
            service: blesta
            entryPoints: [https]
            tls: {}
        services:
          blesta:
            loadBalancer:
              servers:
                - url: http://blesta:8080

  mariadb-config:
    content: |
      [mysqld]
      max_allowed_packet=128M
      wait_timeout=3600

volumes:
  blesta-data: {}
  mariadb-data: {}
